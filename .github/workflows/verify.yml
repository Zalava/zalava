name: Verify Zalava
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [host, oci-default, oci-full-jre]
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull pinned build/test image
        run: |
          image=$(cat ci/playwright/image.txt)
          [[ "$image" =~ ^ghcr\.io/zalava/ci-playwright@sha256:[a-f0-9]{64}$ ]]
          time docker pull "$image"
      - name: Verify ${{ matrix.lane }}
        run: time bash ci/playwright/verify-in-image.sh "$(cat ci/playwright/image.txt)" --lane "${{ matrix.lane }}"
      - name: Record acceptance artifact pins
        if: always()
        run: |
          mkdir -p app/build/reports
          cp app/src/test/resources/released-modules.properties app/build/reports/released-modules.properties
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports-${{ matrix.lane }}
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/browser-acceptance/
            ${{ job.status == 'success' && '!app/build/reports/released-module-acceptance/**/*.jar' || '' }}
  # Keep the existing required status. A skipped/failed/cancelled lane must
  # never make this job pass through GitHub's default dependency skipping.
  check:
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification lane
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
