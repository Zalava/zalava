name: Verify Zalava
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Chromium and native browser dependencies
        run: npx --yes playwright@1.61.0 install --with-deps chromium
      - name: Verify host, API and contract kit
        run: ./gradlew :module-api:test :module-api-test:check :app:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/
            app/build/browser-acceptance/
