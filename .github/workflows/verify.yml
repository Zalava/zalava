name: Verify Zalava
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify host, API and contract kit
        run: ./gradlew :module-api:test :module-api-test:check :app:check -Pplaywright.install-deps=true
      - name: Reject unused browser downloads
        run: |
          if compgen -G "$PLAYWRIGHT_BROWSERS_PATH/firefox-*" > /dev/null || compgen -G "$PLAYWRIGHT_BROWSERS_PATH/webkit-*" > /dev/null; then
            echo "::error::Chromium acceptance downloaded unused Firefox or WebKit browsers"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/browser-acceptance/
