name: Publish module API

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Require a merged default-branch release commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify module API
        run: ./gradlew :module-api:check :module-api-test:check
      - name: Publish immutable module API
        env:
          CI_COMMIT_TAG: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZALAVA_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-configuration-cache :module-api:publishModuleApiPublicationToGitHubPackagesRepository
