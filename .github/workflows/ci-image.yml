name: Build and verify CI image
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main, 'step-ci-image-*']
    paths:
      - ci/playwright/Dockerfile
      - ci/playwright/verify-in-image.sh
      - build.gradle
      - app/build.gradle
      - .github/workflows/ci-image.yml
permissions:
  contents: read
concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve project Playwright version
        id: version
        shell: bash
        run: |
          version=$(sed -n "s/.*'com.microsoft.playwright:playwright'[[:space:]]*:[[:space:]]*'\([^']*\)'.*/\1/p" build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ci/playwright
          platforms: linux/amd64
          push: true
          pull: true
          tags: ghcr.io/zalava/ci-playwright:pw-${{ steps.version.outputs.version }}-${{ github.run_id }}
          build-args: PLAYWRIGHT_VERSION=${{ steps.version.outputs.version }}
          # Scheduled/manual builds refresh native package layers too.
          no-cache: ${{ github.event_name != 'push' }}
          cache-from: type=gha,scope=ci-playwright
          cache-to: type=gha,mode=max,scope=ci-playwright
      - name: Record immutable candidate
        id: reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=ghcr.io/zalava/ci-playwright@$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Candidate: \`ghcr.io/zalava/ci-playwright@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
  trial:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull candidate on a fresh runner
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: time docker pull "$IMAGE"
      - name: Verify host, API and contract kit in candidate
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: time bash ci/playwright/verify-in-image.sh "$IMAGE"
      - name: Record acceptance artifact pins
        if: always()
        run: |
          mkdir -p app/build/reports
          cp app/src/test/resources/released-modules.properties app/build/reports/released-modules.properties
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-image-trial-reports
          path: |
            **/build/reports/
            **/build/test-results/
            app/build/browser-acceptance/
            ${{ job.status == 'success' && '!app/build/reports/released-module-acceptance/**/*.jar' || '' }}
