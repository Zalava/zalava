spring:
  application:
    name: SEA
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  config:
    import: optional:classpath:application.private.yaml
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  ai:
    model:
      chat: unknown
      audio.speech: unknown
      audio.transcription: unknown
      embedding: unknown
      image: unknown
      moderation: unknown

management:
  server:
    port: ${sea.observability.management-port:8082}
  endpoint:
    health:
      probes:
        enabled: true
    restart:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: ${sea.observability.enabled:false}
  info:
    env:
      enabled: false

sea:
  managed-restart:
    dispatcher-enabled: false
  observability:
    enabled: false
  release:
    image: unknown
    revision: unknown
  onboarding:
    starter-module-ids: []
  discovery:
    remote:
      enabled: false
      module-locator-url: ""
      github:
        token: ""
      max-modules: 5
      max-candidates: 10
      blocked-permissions: shell,broad-access,unrestricted-host,host-filesystem-unrestricted,credentials

gg:
  jte:
    development-mode: false
    use-precompiled-templates: true
agent:
  onboarding:
    completed: false
  legacy:
    tools:
      enabled: true
    shell:
      enabled: false
  voice:
    max-bytes: 10485760
    telegram:
      enabled: false
    status-messages:
      enabled: true
  workspace: file:./workspace/
jobrunr:
  background-job-server:
    enabled: true
    worker-count: 1
  dashboard:
    enabled: true
    port: 8081
