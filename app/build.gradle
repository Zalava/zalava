tasks.register('bootuiRun', BootRun) {
    group = 'application'
    description = 'Runs a loopback-only local host with the optional BootUI console.'
    dependsOn tasks.named('precompileJte')
    mainClass = springBoot.mainClass
    classpath = sourceSets.main.runtimeClasspath + configurations.bootuiRuntime + files('jte-classes')
    workingDir = rootProject.projectDir
    systemProperty 'gg.jte.template-location', 'app/src/main/jte'
    systemProperty 'spring.profiles.include', 'local'
    systemProperty 'spring.devtools.restart.enabled', 'false'
    systemProperty 'spring.devtools.livereload.enabled', 'false'
    systemProperty 'server.port', '18080'
    systemProperty 'management.server.port', '18082'

    // Command-line properties also take precedence over environment and local overrides.
    def localOnly = [
        'server.address': '127.0.0.1',
        'management.server.address': '127.0.0.1',
        'jobrunr.dashboard.enabled': 'false',
        'bootui.allow-non-localhost': 'false',
        'bootui.enabled': 'AUTO',
        'bootui.mcp.enabled': 'OFF'
    ]
    doFirst { task ->
        localOnly.each { name, value ->
            if (task.args.any { it == "--${name}" || it.startsWith("--${name}=") }) {
                throw new GradleException("bootuiRun fixes ${name}=${value}; remove its --args override")
            }
            task.args "--${name}=${value}"
        }
    }
}

tasks.register('verifyBootuiIsolation') {
    group = 'verification'
    description = 'Verifies BootUI is available only to bootuiRun and absent from release packaging.'
    dependsOn tasks.named('bootJar')
    def ordinaryClasspaths = [
        runtimeClasspath: configurations.runtimeClasspath,
        testRuntimeClasspath: configurations.testRuntimeClasspath,
        bootRun: tasks.named('bootRun').get().classpath,
        bootJar: tasks.named('bootJar').get().classpath
    ]
    def consoleRuntime = configurations.bootuiRuntime
    def consoleClasspath = tasks.named('bootuiRun').get().classpath
    def archive = tasks.named('bootJar').flatMap { it.archiveFile }
    def imageArchive = tasks.named('bootBuildImage').flatMap { it.archiveFile }
    def packagedBootui = zipTree(archive).matching { include 'BOOT-INF/lib/*bootui*.jar' }
    doLast {
        ordinaryClasspaths.each { name, classpath ->
            if (classpath.files.any { it.name.startsWith('bootui-') && it.name.endsWith('.jar') }) {
                throw new GradleException("BootUI leaked into ${name}")
            }
        }
        def starter = consoleRuntime.files.find {
            it.name == 'bootui-spring-boot-starter-2.1.0.jar'
        }
        if (starter == null || !consoleClasspath.contains(starter)) {
            throw new GradleException('BootUI must be present only on bootuiRun')
        }
        if (!packagedBootui.isEmpty()) {
            throw new GradleException('BootUI leaked into the executable archive')
        }
        if (imageArchive.get().asFile != archive.get().asFile) {
            throw new GradleException('bootBuildImage must use the verified production archive')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBootuiIsolation')
}

// Missing Docker or released artifacts fail the required distributable lane.
['ociImageAcceptanceTest', 'ociJlinkImageAcceptanceTest'].each { taskName ->
tasks.register(taskName, Test) {
    group = 'verification'
    description = 'Builds the pinned OCI image and verifies its JVM and real released-module browser journeys.'
    dependsOn tasks.named('testClasses'), tasks.named('externalModuleFixtureJar'), tasks.named('precompileJte'), installPlaywrightChromium
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    useJUnitPlatform { includeTags 'leyden-image' }
    shouldRunAfter tasks.named('test'), tasks.named('architectureTest'), tasks.named('browserAcceptanceTest'), tasks.named('releasedModuleAcceptanceTest')
    systemProperty 'zalava.test.oci.acceptance', 'true'
    systemProperty 'zalava.test.external-module-jar', tasks.named('externalModuleFixtureJar').flatMap { it.archiveFile }.get().asFile
    systemProperty 'oci.aot', providers.gradleProperty('oci.aot').orElse('true').get()
    systemProperty 'oci.jlink', taskName == 'ociJlinkImageAcceptanceTest' ? 'true' : providers.gradleProperty('oci.jlink').orElse('false').get()
    if (taskName == 'ociJlinkImageAcceptanceTest') shouldRunAfter tasks.named('ociImageAcceptanceTest')
    def requestedImage = providers.gradleProperty('oci.image')
    if (requestedImage.present && taskName == 'ociImageAcceptanceTest') systemProperty 'zalava.leyden.image-name', requestedImage.get()
    outputs.upToDateWhen { false }
}
}
tasks.named('check') { dependsOn tasks.named('ociImageAcceptanceTest'), tasks.named('ociJlinkImageAcceptanceTest') }
