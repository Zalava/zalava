tasks.named('bootBuildImage') {
    imageName = "ghcr.io/zalava/zalava:${project.version}"
    builder = rootProject.file('ci/oci/builder.txt').text.trim()
    runImage = rootProject.file('ci/oci/run-image.txt').text.trim()
    def cachePrefix = providers.gradleProperty('oci.cache-prefix').orElse('zalava-local').get()
    def aotCache = providers.gradleProperty('oci.aot').orElse('true').get()
    def jlink = providers.gradleProperty('oci.jlink').orElse('false').get()
    buildCache {
        volume {
            name = "${cachePrefix}-build-cache"
        }
    }
    launchCache {
        volume {
            name = "${cachePrefix}-launch-cache"
        }
    }
    def leydenTrainingNetwork = providers.gradleProperty('leyden.training.network')
    def leydenTrainingJdbcUrl = providers.gradleProperty('leyden.training.jdbc-url')
    def leydenTrainingUsername = providers.gradleProperty('leyden.training.username')
    def leydenTrainingPassword = providers.gradleProperty('leyden.training.password')

    network = leydenTrainingNetwork.orNull
    environment = [
            'BP_JVM_VERSION': '25.*',
            'BP_JVM_AOTCACHE_ENABLED': aotCache,
            'BP_JVM_JLINK_ENABLED': jlink,
            'BP_JVM_JLINK_ARGS': '--no-man-pages --no-header-files --strip-debug --compress=2 --add-modules java.se,jdk.crypto.ec,jdk.unsupported,jdk.management,jdk.management.jfr,jdk.jfr,jdk.httpserver,jdk.security.auth,jdk.naming.dns,jdk.zipfs,jdk.charsets,jdk.localedata,jdk.net,jdk.security.jgss',
        'SPRING_DATASOURCE_URL': leydenTrainingJdbcUrl.orNull ?: '',
        'SPRING_DATASOURCE_USERNAME': leydenTrainingUsername.orNull ?: '',
        'SPRING_DATASOURCE_PASSWORD': leydenTrainingPassword.orNull ?: '',
            'AGENT_CHANNELS_TELEGRAM_TOKEN': 'false',
            'AGENT_CHANNELS_TELEGRAM_USERNAME': 'false'
    ] + (jlink == 'true' ? ['JRE_HOME': '/layers/paketo-buildpacks_bellsoft-liberica/JLink'] : [:])
    doFirst {
        if (!(aotCache in ['true', 'false']) || !(jlink in ['true', 'false'])) {
            throw new GradleException('oci.aot and oci.jlink must be true or false')
        }
        if (aotCache == 'true') [
            'leyden.training.network': leydenTrainingNetwork.orNull,
            'leyden.training.jdbc-url': leydenTrainingJdbcUrl.orNull,
            'leyden.training.username': leydenTrainingUsername.orNull,
            'leyden.training.password': leydenTrainingPassword.orNull
        ].each { name, value ->
            if (!value) {
                throw new GradleException("${name} must be supplied by leydenImageIntegrationTest")
            }
        }
    }
}

def installPlaywrightChromium = tasks.register('installPlaywrightChromium', JavaExec) {
    group = 'verification'
    description = 'Installs the Chromium headless shell used by browser acceptance.'
    classpath = configurations.testRuntimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    def imageVersion = providers.environmentVariable('ZALAVA_CI_PLAYWRIGHT_VERSION')
    def browserCache = providers.environmentVariable('PLAYWRIGHT_BROWSERS_PATH')
    def playwrightArtifacts = configurations.testRuntimeClasspath.incoming.artifacts.resolvedArtifacts
    def installerLogger = logger
    onlyIf('Chromium is not already supplied by a compatible CI image') {
        if (imageVersion.isPresent()) {
            def matchingJar = "playwright-${imageVersion.get()}.jar"
            if (!playwrightArtifacts.get().any { it.file.name == matchingJar }) {
                def message = "CI image Playwright ${imageVersion.get()} does not match the resolved project dependency; rebuild and update the image pin"
                installerLogger.error(message)
                throw new GradleException(message)
            }
            if (!browserCache.isPresent() || !new File(browserCache.get()).listFiles()?.any {
                it.isDirectory() && it.name.startsWith('chromium_headless_shell-')
            }) {
                def message = 'CI image is missing its preinstalled Chromium headless shell'
                installerLogger.error(message)
                throw new GradleException(message)
            }
            return false
        }
        return true
    }
    args 'install'
    if (providers.gradleProperty('playwright.install-deps').getOrElse('false').toBoolean()) {
        args '--with-deps'
    }
    args '--only-shell', 'chromium'
}

