tasks.named('processResources') {
    from(rootProject.file('docs/module-api-release-guide.md')) {
        into 'development-workspace/docs'
    }
    from(rootProject.file('templates/zalava-module')) {
        exclude 'build/**', '.gradle/**'
        into 'development-workspace/examples/minimal-module'
    }
    from('src/externalModuleFixture') {
        into 'development-workspace/examples/minimal-module/src'
    }
}

bootRun {
    dependsOn tasks.named('precompileJte')
    workingDir = rootProject.projectDir
    systemProperty 'gg.jte.template-location', 'app/src/main/jte'
}
