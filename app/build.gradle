tasks.register('indexedInstallAcceptanceTest', Test) {
    group = 'verification'
    description = 'Runs the opt-in real-network indexed module install/restart/use acceptance journey.'
    dependsOn tasks.named('testClasses')
    dependsOn tasks.named('precompileJte')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    useJUnitPlatform {
        includeTags 'indexed-install'
    }
    reports.html.required = true
    reports.junitXml.required = true
    [
        'zalava.indexed-install.publish-token': 'ZALAVA_INDEXED_INSTALL_PUBLISH_TOKEN',
        'zalava.indexed-install.github-packages-username': 'ZALAVA_INDEXED_INSTALL_GITHUB_PACKAGES_USERNAME',
        'zalava.indexed-install.github-packages-token': 'ZALAVA_INDEXED_INSTALL_GITHUB_PACKAGES_TOKEN',
        'zalava.indexed-install.module-locator-url': 'ZALAVA_INDEXED_INSTALL_MODULE_LOCATOR_URL'
    ].each { propertyName, environmentName ->
        def value = providers.systemProperty(propertyName)
                .orElse(providers.gradleProperty(propertyName))
                .orElse(providers.environmentVariable(environmentName))
        if (value.present) {
            systemProperty propertyName, value.get()
        }
    }
}

