plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'gg.jte.gradle' version '3.2.4'
}

sourceSets {
    externalModuleFixture
    test {
        runtimeClasspath += files('jte-classes')
    }
}

def frontendDirectory = layout.projectDirectory.dir('frontend')
def frontendOutput = layout.projectDirectory.dir('src/main/resources/static/zalava-chat')

tasks.register('installFrontend', Exec) {
    workingDir frontendDirectory
    inputs.file(frontendDirectory.file('package.json'))
    inputs.file(frontendDirectory.file('package-lock.json'))
    outputs.dir(frontendDirectory.dir('node_modules'))
    commandLine 'npm', 'ci'
}

tasks.register('buildFrontend', Exec) {
    dependsOn tasks.named('installFrontend')
    workingDir frontendDirectory
    inputs.dir(frontendDirectory.dir('src'))
    inputs.file(frontendDirectory.file('index.html'))
    inputs.file(frontendDirectory.file('vite.config.js'))
    outputs.dir(frontendOutput)
    commandLine 'npm', 'run', 'build'
}

tasks.named('processResources') {
    dependsOn tasks.named('buildFrontend')
}

rootProject.tasks.named('spotlessJava') {
    mustRunAfter tasks.named('buildFrontend')
}

