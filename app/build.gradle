tasks.register('externalModuleFixtureJar', Jar) {
    archiveBaseName = 'zalava-external-module-fixture'
    archiveVersion = '1.0.0'
    from sourceSets.externalModuleFixture.output
}

springBoot {
    buildInfo {
        excludes = ['time']
    }
    mainClass = 'org.zalava.ZalavaApplication'
}

bootJar {
    archiveBaseName = 'zalava'
    dependsOn tasks.named('precompileJte')
    bootInf {
        into('classes') {
            from fileTree('jte-classes') {
                include 'gg/jte/generated/precompiled/**/*.class'
                include 'gg/jte/generated/precompiled/**/*.bin'
            }
        }
    }
}

jte {
    precompile()
}

tasks.named('bootBuildImage') {
    imageName = "ghcr.io/zalava/zalava:${project.version}"
    buildCache {
        volume {
            name = 'zalava-local-build-cache'
        }
    }
    launchCache {
        volume {
            name = 'zalava-local-launch-cache'
        }
    }
    def leydenTrainingNetwork = providers.gradleProperty('leyden.training.network')
    def leydenTrainingJdbcUrl = providers.gradleProperty('leyden.training.jdbc-url')
    def leydenTrainingUsername = providers.gradleProperty('leyden.training.username')
    def leydenTrainingPassword = providers.gradleProperty('leyden.training.password')

    network = leydenTrainingNetwork.orNull
    environment = [
            'BP_JVM_VERSION': '25.*',
            'BP_JVM_AOTCACHE_ENABLED': 'true',
        'SPRING_DATASOURCE_URL': leydenTrainingJdbcUrl.orNull ?: '',
        'SPRING_DATASOURCE_USERNAME': leydenTrainingUsername.orNull ?: '',
        'SPRING_DATASOURCE_PASSWORD': leydenTrainingPassword.orNull ?: '',
            'AGENT_CHANNELS_TELEGRAM_TOKEN': 'false',
            'AGENT_CHANNELS_TELEGRAM_USERNAME': 'false'
    ]
    doFirst {
        [
            'leyden.training.network': leydenTrainingNetwork.orNull,
            'leyden.training.jdbc-url': leydenTrainingJdbcUrl.orNull,
            'leyden.training.username': leydenTrainingUsername.orNull,
            'leyden.training.password': leydenTrainingPassword.orNull
        ].each { name, value ->
            if (!value) {
                throw new GradleException("${name} must be supplied by leydenImageIntegrationTest")
            }
        }
    }
}

tasks.named('test') {
    def configuredForks = providers.gradleProperty('zalava.test.max-parallel-forks').getOrElse('2')
    maxParallelForks = configuredForks.toInteger()
    if (maxParallelForks < 1) {
        throw new GradleException('zalava.test.max-parallel-forks must be at least 1')
    }
    dependsOn tasks.named('externalModuleFixtureJar')
    dependsOn tasks.named('bootJar')
    dependsOn tasks.named('precompileJte')
    exclude '**/PortsAndAdaptersArchitectureTest.class'
    exclude '**/Browser*AcceptanceTest.class'
    useJUnitPlatform {
        excludeTags 'postgresql'
        excludeTags 'leyden-image'
        excludeTags 'indexed-install'
        excludeTags 'module-compat'
        excludeTags 'released-module-distributable'
        excludeTags 'ocr-worker'
        excludeTags 'retrieval-measurement'
        excludeTags 'context-measurement'
        excludeTags 'knowledge-context-acceptance'
        excludeTags 'structured-output-acceptance'
        excludeTags 'memory-selection-measurement'
        excludeTags 'skill-activation-measurement'
    }
    systemProperty 'zalava.test.external-module-jar',
            tasks.named('externalModuleFixtureJar').flatMap { it.archiveFile }.get().asFile
    systemProperty 'zalava.test.boot-jar',
        tasks.named('bootJar').flatMap { it.archiveFile }.get().asFile
    systemProperty 'zalava.test.version', project.version
}

tasks.register('architectureTest', Test) {
    group = 'verification'
    description = 'Runs the ArchUnit architecture rules excluded from the fast test lane.'
    dependsOn tasks.named('testClasses')
    dependsOn tasks.named('precompileJte')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    include '**/PortsAndAdaptersArchitectureTest.class'
    useJUnitPlatform()
}

tasks.register('releasedModuleAcceptanceTest', Test) {
    group = 'verification'
    description = 'Runs released official JARs through a packaged host, PostgreSQL and browser journeys.'
    dependsOn tasks.named('testClasses'), tasks.named('bootJar')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    maxParallelForks = 1
    useJUnitPlatform { includeTags 'released-module-distributable' }
    systemProperty 'zalava.test.boot-jar', tasks.named('bootJar').flatMap { it.archiveFile }.get().asFile
    reports.html.required = true
    reports.junitXml.required = true
}

tasks.named('check') {
    dependsOn tasks.named('architectureTest')
    dependsOn tasks.named('browserAcceptanceTest')
    dependsOn tasks.named('releasedModuleAcceptanceTest')
}

tasks.register('browserAcceptanceTest', Test) {
    group = 'verification'
    description = 'Runs the isolated Playwright browser acceptance journey.'
    dependsOn tasks.named('testClasses')
    dependsOn tasks.named('precompileJte')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
    include '**/Browser*AcceptanceTest.class'
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    useJUnitPlatform()
    reports.html.required = true
    reports.junitXml.required = true
}

