plugins {
    id 'jacoco'
    id 'com.diffplug.spotless' version '7.2.1'
  id 'java-library'
}

group = 'org.zalava.modules'
version = '0.1.0-alpha.1'

def repositoryUrl = providers.gradleProperty('zalavaRepositoryUrl')
if (!repositoryUrl.present) {
  throw new GradleException('zalavaRepositoryUrl must identify the public Maven-layout repository')
}

repositories {
  maven { url = uri(repositoryUrl.get()) }
  mavenCentral()
}

dependencies {
    compileOnly 'org.zalava:module-api:0.1.0-alpha.6'
    testImplementation 'org.zalava:module-api:0.1.0-alpha.6'
    testImplementation 'org.zalava:module-api-test:0.1.0-alpha.6'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

java {
  toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(Test).configureEach {
  useJUnitPlatform()
}

tasks.named('test') {
    dependsOn tasks.named('jar')
    def moduleArtifact = tasks.named('jar').flatMap { it.archiveFile }
    systemProperty 'module.artifact', moduleArtifact.get().asFile.absolutePath
    systemProperty 'module.version', project.version.toString()
    // Contract tests load the actual built artifact, never main source output.
    classpath = files(sourceSets.test.output, configurations.testRuntimeClasspath)
}


// Keep module quality gates aligned with the Zalava host.
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.36.1')
    }
}

jacoco {
    toolVersion = '0.8.14'
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.74
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
